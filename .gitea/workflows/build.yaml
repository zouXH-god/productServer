name: Build Product Server

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend for embedding
        working-directory: frontend
        run: npm run build

      - name: Test backend
        run: go test ./...

      - name: Build embedded multi-platform binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p build
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            extension=""
            if [ "$os" = "windows" ]; then extension=".exe"; fi
            output="build/productserver-${os}-${arch}${extension}"
            echo "Building ${os}/${arch}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$output" .
          done
          (cd build && sha256sum productserver-* > SHA256SUMS)

      - name: Save build artifact
        uses: actions/upload-artifact@v3
        with:
          name: productserver-multi-platform
          path: |
            build/productserver-*
            build/SHA256SUMS

      - name: Upload build artifact to Product Server
        uses: https://gitea.s1f.ren/shiran/product-server-action@v1.2
        with:
          url: ${{ vars.ARTIFACT_SERVER_URL }}
          token: ${{ vars.ARTIFACT_SERVER_TOKEN }}
          path: |
            build/productserver-*
            build/SHA256SUMS
          name: productserver-multi-platform
