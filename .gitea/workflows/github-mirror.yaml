name: Mirror to GitHub

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitHub mirror configuration
        env:
          MIRROR_REPOSITORY: ${{ vars.MIRROR_REPOSITORY }}
          MIRROR_FINE_GRAINED_TOKEN: ${{ secrets.MIRROR_FINE_GRAINED_TOKEN }}
        run: |
          set -eu
          if [ -z "$MIRROR_REPOSITORY" ]; then
            echo "Missing repository variable: MIRROR_REPOSITORY (expected owner/repository)" >&2
            exit 1
          fi
          if ! printf '%s' "$MIRROR_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "MIRROR_REPOSITORY must use owner/repository format" >&2
            exit 1
          fi
          if [ -z "$MIRROR_FINE_GRAINED_TOKEN" ]; then
            echo "Missing secret: MIRROR_FINE_GRAINED_TOKEN" >&2
            exit 1
          fi
          echo "The Fine-grained PAT must grant Contents and Workflows read/write access to $MIRROR_REPOSITORY"
          echo "::add-mask::$MIRROR_FINE_GRAINED_TOKEN"

      - name: Remove Gitea workflow definitions
        run: |
          set -eu
          git rm -r --ignore-unmatch .gitea/workflows
          sed -E -i "s#^([[:space:]]*- uses: )[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(/uploader)?(@[^[:space:]]+)#\1zouXH-god/product-server-action\3#" README.md
          git add README.md
          git config user.name "productserver-mirror"
          git config user.email "productserver-mirror@users.noreply.github.com"
          git commit -m "chore: prepare GitHub mirror"

      - name: Push sanitized branch to GitHub
        env:
          MIRROR_REPOSITORY: ${{ vars.MIRROR_REPOSITORY }}
          MIRROR_FINE_GRAINED_TOKEN: ${{ secrets.MIRROR_FINE_GRAINED_TOKEN }}
          SOURCE_REF_NAME: ${{ gitea.ref_name }}
          SOURCE_REF_TYPE: ${{ gitea.ref_type }}
        run: |
          set -eu
          echo "::add-mask::$MIRROR_FINE_GRAINED_TOKEN"
          git remote remove github 2>/dev/null || true
          git remote add github "https://x-access-token:${MIRROR_FINE_GRAINED_TOKEN}@github.com/${MIRROR_REPOSITORY}.git"
          if [ "$SOURCE_REF_TYPE" = "tag" ]; then
            git push --force github "HEAD:refs/tags/${SOURCE_REF_NAME}"
          else
            git push --force github "HEAD:refs/heads/${SOURCE_REF_NAME}"
          fi
